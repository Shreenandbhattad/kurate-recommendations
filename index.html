<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Kurate Recommendations - Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* ── Password gate ───────────────────────────────────────── */
#gate{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:#fff;
  opacity:1;
}

.gate-card{
  display:flex;flex-direction:column;align-items:center;gap:28px;
  padding:52px 48px 44px;
  background:rgba(255,255,255,0.72);
  border:1px solid rgba(52,17,75,0.1);
  border-radius:20px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:0 8px 48px rgba(52,17,75,0.08),0 2px 12px rgba(52,17,75,0.05);
  width:min(360px,90vw);
  animation:gate-in .7s var(--ease) both;
}
@keyframes gate-in{
  from{opacity:0;transform:translateY(22px) scale(.94)}
  to{opacity:1;transform:none}
}

.gate-brand img{
  width:64px;height:64px;
  object-fit:contain;display:block;
  margin:0 auto;
  animation:gate-brand-in .8s .1s var(--ease) both, gate-brand-breathe 4s 1s ease-in-out infinite;
}
@keyframes gate-brand-in{
  from{opacity:0;transform:scale(.7) rotate(-8deg)}
  to{opacity:1;transform:none}
}
@keyframes gate-brand-breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}
@media(prefers-reduced-motion:reduce){
  .gate-brand img{animation:none}
}

.gate-hint{
  font-size:.76rem;color:#9b8aaa;letter-spacing:.01em;text-align:center;
  line-height:1.5;margin-top:-14px
}

.gate-input-wrap{
  position:relative;width:100%
}
#pwInput{
  width:100%;
  padding:13px 46px 13px 16px;
  border:1.5px solid rgba(52,17,75,0.18);
  border-radius:10px;
  font-size:.9rem;font-family:inherit;
  color:#1a0b24;background:rgba(255,255,255,0.9);
  outline:none;
  transition:border-color .25s var(--ease),box-shadow .25s var(--ease);
  letter-spacing:.02em;
}
#pwInput::placeholder{letter-spacing:.01em;color:#b8a8c8}
#pwInput:focus{
  border-color:#34114b;
  box-shadow:0 0 0 3px rgba(52,17,75,0.09)
}
#pwInput.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-3px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-5px)}
  40%,60%{transform:translateX(5px)}
}
#pwInput.error{border-color:#ff6e60;box-shadow:0 0 0 3px rgba(255,110,96,0.12)}

.eye-btn{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:2px;
  color:#b8a8c8;transition:color .15s;display:flex;align-items:center
}
.eye-btn:hover{color:#34114b}

#gateBtn{
  width:100%;padding:13px;
  background:#34114b;color:#fff;
  border:none;border-radius:10px;
  font-size:.88rem;font-family:inherit;font-weight:600;
  cursor:pointer;letter-spacing:.02em;
  transition:background .25s var(--ease),transform .18s var(--ease),box-shadow .25s var(--ease);
  box-shadow:0 2px 12px rgba(52,17,75,0.22)
}
#gateBtn:hover{background:#4a1a6e;box-shadow:0 6px 22px rgba(52,17,75,0.32);transform:translateY(-1px)}
#gateBtn:active{transform:scale(.98)}

#gateErr{
  font-size:.72rem;color:#ff6e60;
  height:16px;text-align:center;
  transition:opacity .2s
}
/* ── End password gate ───────────────────────────────────── */

:root {
  --bg: #ffffff;
  --surface: #f9f8fb;
  --surface2: #f0ecf5;
  --border: #e6e0ed;
  --text: #1a0b24;
  --muted: #7c6a8a;
  --main: #34114b;
  --accent: #ff6e60;
  --dev: #b8860b;
  --main-soft: rgba(52,17,75,0.07);
  --accent-soft: rgba(255,110,96,0.1);
  --dev-soft: rgba(184,134,11,0.1);
  --sidebar-w: 288px;
  --ease: cubic-bezier(.16,1,.3,1);
  --ease-soft: cubic-bezier(.25,.46,.45,.94);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-size:18px;
  -webkit-text-size-adjust:100%;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',system-ui,sans-serif;
  line-height:1.5;
  overflow:hidden;
  position:relative;
}

/* ── Ambient aurora backdrop ─────────────────────────────── */
.aurora{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  overflow:hidden;
}
.aurora::before,.aurora::after{
  content:'';position:absolute;border-radius:50%;
  filter:blur(80px);opacity:.35;
  will-change:transform;
}
.aurora::before{
  width:520px;height:520px;top:-180px;left:-120px;
  background:radial-gradient(circle,rgba(52,17,75,.35),transparent 70%);
  animation:aurora-drift-a 26s ease-in-out infinite;
}
.aurora::after{
  width:460px;height:460px;bottom:-160px;right:-100px;
  background:radial-gradient(circle,rgba(255,110,96,.3),transparent 70%);
  animation:aurora-drift-b 22s ease-in-out infinite;
}
@keyframes aurora-drift-a{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(60px,40px)}
}
@keyframes aurora-drift-b{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-50px,-30px)}
}
@media(prefers-reduced-motion:reduce){
  .aurora::before,.aurora::after{animation:none}
}

/* ── Header ─────────────────────────────────────────────── */
header{
  height:46px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  position:sticky;top:0;z-index:100;
  background:var(--bg);
}
.header-left{display:flex;align-items:center;gap:10px}
.sidebar-toggle{
  width:32px;height:32px;border:1.5px solid var(--border);border-radius:6px;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease);flex-shrink:0
}
.sidebar-toggle:hover{color:var(--main);border-color:var(--main);background:var(--main-soft);transform:scale(1.06)}
.sidebar-toggle:active{transform:scale(.94)}
.site-title{
  font-size:.82rem;font-weight:600;letter-spacing:.01em;
  color:var(--main);white-space:nowrap
}
.legend{display:flex;gap:16px;font-size:.72rem;color:var(--muted)}
.legend-item{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.content{background:var(--main)}
.dot.ux{background:var(--accent)}
.dot.dev{background:var(--dev)}

/* ── Layout ──────────────────────────────────────────────── */
.app{display:flex;height:calc(100vh - 46px);overflow:hidden}


/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  padding:10px 0;background:var(--surface);
  transition:width .3s var(--ease),min-width .3s var(--ease),opacity .25s var(--ease),padding .3s var(--ease);
  flex-shrink:0;position:relative
}
.sidebar.collapsed{width:0;min-width:0;padding:0;opacity:0;pointer-events:none;border-right:none}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.section-label{
  padding:10px 14px 3px;
  font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);font-weight:700;white-space:nowrap
}
.nav-highlight{
  position:absolute;left:0;width:100%;
  background:var(--main-soft);border-left:2.5px solid var(--main);
  border-radius:0 6px 6px 0;
  opacity:0;pointer-events:none;z-index:0;
  transition:transform .22s var(--ease-soft),height .22s var(--ease-soft),opacity .2s ease;
}
.nav-item{
  width:100%;border:0;display:flex;align-items:center;gap:8px;
  padding:7px 14px;background:transparent;cursor:pointer;
  border-left:2.5px solid transparent;font-size:.78rem;font-family:inherit;
  text-align:left;color:var(--muted);white-space:nowrap;
  transition:color .18s var(--ease),font-weight .18s var(--ease);
  position:relative;z-index:1
}
.nav-item:hover:not(.active){color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--main);font-weight:600}
.nav-item .nav-label{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-item .badge{
  margin-left:auto;font-size:.58rem;background:var(--surface2);
  border-radius:8px;padding:1px 6px;color:var(--muted);flex-shrink:0;
  transition:background .2s var(--ease),color .2s var(--ease)
}
.nav-item.active .badge{background:rgba(52,17,75,.15);color:var(--main)}
.nav-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--border);transition:background .2s var(--ease),transform .2s var(--ease)}
.nav-item.has-notes .nav-dot{background:var(--main)}
.nav-item.active .nav-dot{transform:scale(1.3)}

/* ── Main ────────────────────────────────────────────────── */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}

/* ── Progress bar ────────────────────────────────────────── */
.progress-track{
  height:2.5px;flex-shrink:0;background:var(--surface2);
  position:relative;overflow:hidden
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--main),var(--accent));
  transition:width .35s var(--ease);
}

/* ── Screen viewer ───────────────────────────────────────── */
.screen-viewer{
  flex:1;min-height:0;
  padding:24px 48px 20px;
  display:flex;align-items:flex-start;gap:28px;
  overflow-x:auto;overflow-y:hidden;
  scroll-behavior:smooth;
  scroll-padding-inline:48px;
  scroll-snap-type:x proximity;
  perspective:1400px;
}
.screen-viewer::-webkit-scrollbar{height:5px}
.screen-viewer::-webkit-scrollbar-track{background:var(--surface)}
.screen-viewer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.screen-viewer::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.review-card{
  flex:0 0 min(480px,calc(100vw - 368px));
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  gap:18px;scroll-snap-align:center;
  opacity:.65;transform:scale(.98);
  transition:opacity .35s var(--ease),transform .35s var(--ease);
  /* no contain — allows comment card to overflow card boundary */
  overflow:visible
}
/* When the sidebar is collapsed it isn't reserving 288px anymore — let
   cards actually use that freed-up width instead of staying artificially
   narrow/off-center as if it were still there. */
.sidebar.collapsed ~ .main .review-card{flex-basis:min(480px,calc(100vw - 80px))}
.review-card.active-screen,.review-card:hover{opacity:1;transform:scale(1);z-index:2;position:relative}
/* Every .review-card sets opacity + transform even at rest, and both of
   those create a new stacking context on their own - so a popup's own
   z-index:100 only ever wins WITHIN its own card, never over a sibling
   card that outranks it. If you open a pin on a side (non-active) card
   and its popup overflows toward the centered card, the centered card
   (z-index:2) was painting over the popup - including its own close
   button, which still worked in the DOM but was visually unclickable.
   This class outranks every other card, active or not, for as long as
   its popup is open. */
.review-card.has-open-popup{z-index:6;opacity:1;transform:scale(1)}
@keyframes card-enter{
  from{opacity:0;transform:scale(.9) translateY(16px)}
}
.review-card{animation:card-enter .5s var(--ease) both}
@media(prefers-reduced-motion:reduce){.review-card{animation:none}}

.phone-wrapper{
  position:relative;flex-shrink:0;
  width:min(250px,calc(100vw - 408px));
  overflow:visible;
  filter:drop-shadow(0 16px 40px rgba(52,17,75,.15));
  transition:filter .3s var(--ease),width .3s var(--ease);
  transform-style:preserve-3d;
}
.sidebar.collapsed ~ .main .phone-wrapper{width:min(250px,calc(100vw - 120px))}
.review-card.active-screen .phone-wrapper:hover{filter:drop-shadow(0 22px 52px rgba(52,17,75,.22))}
.phone-frame{
  position:relative;overflow:hidden;
  border-radius:32px;background:#f5f0f8;
  transition:transform .4s var(--ease);
  transform-style:preserve-3d;
  will-change:transform;
}
/* Purple corner overlay — masks screenshot white edges */
.phone-frame::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 2px var(--main);
  pointer-events:none;z-index:10
}
.review-card.active-screen .phone-frame{transform:translateY(-2px)}
.phone-img{
  width:100%;
  height:auto;
  display:block;
  max-height:calc(100vh - 180px);
  object-fit:contain;object-position:top
}
@media(prefers-reduced-motion:reduce){
  .phone-frame,.phone-wrapper{transition:none}
}

/* ── Pins ─────────────────────────────────────────────────── */
.pin{
  position:absolute;transform:translate(-50%,-50%) scale(.5);
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.62rem;font-weight:700;z-index:10;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 4px 14px rgba(0,0,0,.2);
  opacity:0;transition:opacity .3s var(--ease),transform .35s var(--ease),box-shadow .2s var(--ease);
  font-family:inherit;user-select:none
}
.pin.ready{opacity:.9;transform:translate(-50%,-50%) scale(1)}
.pin.content{background:var(--main);color:#fff}
.pin.ux{background:var(--accent);color:#fff}
.pin.dev{background:var(--dev);color:#fff}
/* Idle pins get a "ping" ring - transform+opacity only (compositor-cheap),
   and it only ever runs on the ACTIVE screen's pins. With 55 screens all
   rendered in the DOM at once, animating box-shadow (a paint-triggering
   property) on every off-screen pin simultaneously was the single biggest
   cause of the page feeling laggy - up to 50 elements repainting forever,
   almost all invisible. Pins outside the active screen just sit static. */
.pin::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  opacity:0;pointer-events:none
}
.review-card.active-screen .pin.content.ready:not(.active):not(:hover)::after{
  background:var(--main);animation:pin-ping 3.4s ease-out infinite
}
.review-card.active-screen .pin.ux.ready:not(.active):not(:hover)::after{
  background:var(--accent);animation:pin-ping 3.4s ease-out infinite
}
.review-card.active-screen .pin.dev.ready:not(.active):not(:hover)::after{
  background:var(--dev);animation:pin-ping 3.4s ease-out infinite
}
@keyframes pin-ping{
  0%{transform:scale(1);opacity:.45}
  70%,100%{transform:scale(2.2);opacity:0}
}
.pin:hover,.pin.active{
  transform:translate(-50%,-50%) scale(1.2);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:1
}
.pin:hover::after,.pin.active::after{animation:none;opacity:0}
@media(prefers-reduced-motion:reduce){
  .pin::after{animation:none!important}
}

/* ── Feedback panel ──────────────────────────────────────── */
.feedback-panel{width:min(560px,100%);text-align:center}
.screen-meta{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.screen-title-area h2{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.empty-state p{font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:6px}

/* ── Comment popup — absolute inside .phone-wrapper, scrolls with card ── */
.card-popup{
  position:absolute;
  width:260px;
  display:none;
  z-index:100;
  opacity:0;transform:scale(.92) translateY(4px);
  transform-origin:left center;
  transition:opacity .28s var(--ease),transform .28s var(--ease),top .25s var(--ease);
}
.card-popup.open{opacity:1;transform:scale(1) translateY(0)}
.comment-card{
  border:1px solid rgba(52,17,75,.18);border-radius:10px;padding:10px 12px;
  background:#ffffff !important;
  box-shadow:0 8px 28px rgba(52,17,75,.16),0 2px 6px rgba(52,17,75,.08);
  text-align:left
}
.comment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.comment-type{font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1px}
.comment-type.content{color:var(--main)}
.comment-type.ux{color:var(--accent)}
.comment-type.dev{color:var(--dev)}
.comment-title{color:var(--text);font-weight:600;line-height:1.25;font-size:.78rem}
.comment-close{
  width:20px;height:20px;border:1px solid var(--border);border-radius:4px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .18s var(--ease)
}
.comment-close:hover{border-color:var(--main);color:var(--main);background:var(--main-soft);transform:rotate(90deg)}
.comment-label{margin-top:8px;margin-bottom:2px;color:var(--muted);font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.comment-copy{color:var(--text);font-size:.76rem;line-height:1.55}

/* ── Replies thread ──────────────────────────────────────── */
.reply-divider{margin:10px 0 7px;border:0;border-top:1px solid var(--border)}
.replies-header{font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.reply-list{display:flex;flex-direction:column}
.reply-item{padding:5px 0;border-bottom:1px solid var(--surface2)}
.reply-item:last-child{border-bottom:none}
.reply-row{display:flex;align-items:baseline;gap:4px;margin-bottom:1px}
.reply-meta{font-size:.6rem;color:var(--muted);flex:1;min-width:0}
.reply-meta strong{color:var(--text);font-weight:600}
.reply-icon-btns{display:flex;gap:1px;flex-shrink:0;}
.reply-icon-btn{
  background:none;border:none;cursor:pointer;
  color:var(--border);padding:2px;border-radius:3px;
  display:flex;align-items:center;transition:color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease)
}
.reply-icon-btn:hover{transform:scale(1.15)}
.reply-icon-btn:hover{color:var(--main);background:var(--main-soft)}
.reply-icon-btn.del:hover{color:var(--accent);background:var(--accent-soft)}
.reply-text{font-size:.75rem;color:var(--text);line-height:1.45;word-break:break-word}
.reply-text-edit{width:100%;border:1px solid var(--main);border-radius:5px;padding:3px 6px;font-size:.75rem;font-family:inherit;color:var(--text);background:#fff;outline:none;resize:none;margin-top:3px}
.reply-save-btn{font-size:.6rem;font-weight:600;color:#fff;background:var(--main);border:none;border-radius:3px;padding:2px 7px;cursor:pointer;font-family:inherit;margin-top:3px}
.reply-empty{font-size:.68rem;color:var(--muted);padding:3px 0 5px}
.reply-add{display:flex;gap:4px;align-items:flex-end;padding-top:7px;border-top:1px solid var(--border);margin-top:2px}
.reply-name-input{width:72px;flex-shrink:0;border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:.7rem;font-family:inherit;color:var(--text);background:#fff;outline:none}
.reply-msg-input{flex:1;min-width:0;border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:.7rem;font-family:inherit;color:var(--text);background:#fff;outline:none;resize:none}
.reply-name-input:focus,.reply-msg-input:focus{border-color:var(--main)}
.reply-submit{width:26px;height:26px;flex-shrink:0;background:var(--main);border:none;color:#fff;border-radius:5px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:background .18s var(--ease),transform .18s var(--ease)}
.reply-submit:hover{background:#4a1a6e;transform:scale(1.08) translateX(1px)}
.reply-submit:active{transform:scale(.92)}
.reply-item{animation:reply-in .35s var(--ease) both}
@keyframes reply-in{from{opacity:0;transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){.reply-item{animation:none}}

/* ── Nav bar ─────────────────────────────────────────────── */
/* ── Bottom-right logo ───────────────────────────────────── */
.corner-logo-fixed{
  position:fixed;bottom:18px;right:18px;z-index:90;
  width:36px;height:36px;object-fit:contain;
  opacity:.55;transition:opacity .25s var(--ease),transform .3s var(--ease)
}
.corner-logo-fixed:hover{opacity:1;transform:rotate(-8deg) scale(1.08)}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:820px){
  header{padding:0 14px;height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:8px}
  .app{display:block;height:auto;overflow:auto}
  .sidebar{width:100%!important;min-width:0!important;max-height:140px;border-right:none;border-bottom:1.5px solid var(--border);opacity:1!important;pointer-events:auto!important}
  .sidebar.collapsed{max-height:0;padding:0}
  .screen-viewer{padding:20px 16px 24px;scroll-padding-inline:16px;gap:16px}
  .review-card{flex-basis:calc(100vw - 32px);opacity:1;transform:none}
  .phone-wrapper{width:min(340px,calc(100vw - 48px));max-height:none}
  .phone-img{max-height:none}
  .inline-comment{width:min(360px,100%)}
}

    <div class="gate-input-wrap">
      <input id="pwInput" type="password" placeholder="Password"
        autocomplete="off" spellcheck="false"/>
      <button class="eye-btn" type="button" onclick="toggleEye()" tabindex="-1" aria-label="Show password">
        <!-- eye open -->
        <svg id="eyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>

        <!-- eye off/hidden -->
        <svg id="eyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button id="gateBtn" type="button" onclick="unlock()">Continue</button>

<script>
const screens = [
{id:"onboarding_1",page:2,title:"Onboarding 1",section:"Onboarding",img_src:"assets/screens/01-onboarding-1.jpg",annotations:[{x:63,y:45,type:"content",label:"Welcome Copy - Rewrite",what:"The internet is full of things worth finding. Kurate helps the right things find their way to you. Meaningful discovery. Mindful saving. Finite Feed.",why:"Drops “kurate” as a verb/noun before the user knows the product (tests worst of any framing in the survey) and replaces “for sharing, not scrolling” - the wrong emphasis, since 62% want a personal library vs. 9% who want it for sharing."}]},
{id:"onboarding_2",page:3,title:"Onboarding 2",section:"Onboarding",img_src:"assets/screens/02-onboarding-2.jpg",annotations:[{x:63,y:28,type:"content",label:"Invite Gate Copy",what:"Have an invite? Enter it below. We open Kurate through small, thoughtful groups to build a community worth joining.",why:"“Invite only” reads a little velvet-rope; “opens slowly, on purpose” maintains exclusivity but frames it as deliberateness (Sage/Explorer), not exclusivity or status."},{x:63,y:68,type:"ux",label:"Move Secondary Link Up",what:"Move ‘No code yet? Help us reach out to you’ up in grey under ‘enter code’.",why:"Keeps the fallback path visible without competing with the primary CTA below it."}]},
{id:"onboarding_3",page:4,title:"Onboarding 3",section:"Onboarding",img_src:"assets/screens/03-onboarding-3.jpg",annotations:[{x:63,y:30,type:"content",label:"Mobile Entry Copy",what:"“We'll text you a code to confirm it's you.” Button: “Send code”",why:""},{x:63,y:68,type:"ux",label:"Progress Bar",what:"Remove the progress bars or increase the number of checkpoints.",why:"Two vague checkpoints for an 18-screen flow undersells (or overstates) actual progress either way."}]},
{id:"onboarding_4",page:5,title:"Onboarding 4",section:"Onboarding",img_src:"assets/screens/04-onboarding-4.jpg",annotations:[{x:63,y:45,type:"content",label:"Verify Phone Copy",what:"“Enter the code” - “We sent it to +91XXXXXXX269.” - “Resend in 0:26” · Button: “Continue”",why:"Drops “OTP” for consistency."}]},
{id:"onboarding_5",page:6,title:"Onboarding 5",section:"Onboarding",img_src:"assets/screens/05-onboarding-5.jpg",annotations:[{x:63,y:28,type:"content",label:"Name Prompt Copy",what:"This is the name others will see on Kurate.",why:"Clarifies this is a name entry and differentiates it from the username entry that follows."},{x:63,y:68,type:"ux",label:"Tick Mark Shouldn't Validate a Name",what:"There's a checkmark that validates the entry, but since this is a free-text name field, that kind of validation shouldn't appear here.",why:"A validation tick implies there's a right/wrong answer to check against, which doesn't apply to an open-ended name field - it'll just read as a confusing false signal."}]},
{id:"onboarding_6",page:7,title:"Onboarding 6",section:"Onboarding",img_src:"assets/screens/06-onboarding-6.jpg",annotations:[]},
{id:"onboarding_7",page:8,title:"Onboarding 7",section:"Onboarding",img_src:"assets/screens/07-onboarding-7.jpg",annotations:[{x:63,y:60,type:"ux",label:"Duplicate Screen?",what:"This headline (“Give your profile a face”) also appears on Onboarding 9.",why:"Check whether one of these is a duplicate/leftover screen in the flow."}]},
{id:"onboarding_8",page:9,title:"Onboarding 8",section:"Onboarding",img_src:"assets/screens/08-onboarding-8.jpg",annotations:[{x:63,y:45,type:"dev",label:"Bug - Can't Import a Photo",what:"Unable to import a photo or drag one in on this screen.",why:"A broken upload step this early in onboarding blocks progress entirely for anyone who hits it."}]},
{id:"onboarding_9",page:10,title:"Onboarding 9",section:"Onboarding",img_src:"assets/screens/09-onboarding-9.jpg",annotations:[{x:63,y:26,type:"content",label:"Email Step Copy",what:"(Photo portion mirrors Onboarding – 7.) Email portion: “Add a way back in.” “So you're never locked out if you switch devices.”",why:"“Connect an account to log back in faster” is generic SaaS phrasing; reframing around not losing access to your library is warmer and ties to the core positioning promise."},{x:63,y:66,type:"ux",label:"Duplicate Screen?",what:"Repeats the “profile a face” copy from step 7.",why:"Check for a duplicated screen in the flow."}]},
{id:"onboarding_10",page:11,title:"Onboarding 10",section:"Onboarding",img_src:"assets/screens/10-onboarding-10.jpg",annotations:[{x:63,y:26,type:"content",label:"Greeting Copy",what:"Glad to have you here, Neha! I'm Mara, I'll help you find your footing.",why:"The onboarding experience breaks from here because Mara takes over from the next screen."},{x:63,y:66,type:"ux",label:"Personalization Token?",what:"Copy hard-codes the name “Shreya” in the source file.",why:"Confirm this is a live personalization token, not a static test value."}]},
{id:"onboarding_10_1",page:12,title:"Onboarding 10.1",section:"Onboarding",img_src:"assets/screens/11-onboarding-10-1.jpg",annotations:[]},
{id:"onboarding_11",page:13,title:"Onboarding 11",section:"Onboarding",img_src:"assets/screens/12-onboarding-11.jpg",annotations:[{x:63,y:15,type:"content",label:"Topics Prompt Tone",what:"Soften “what are you really into?” and keep Mara's voice consistently personal (not algorithmic) going forward.",why:"“Really into” reads a touch try-hard."},{x:63,y:35,type:"ux",label:"Confirm Mara Branding",what:"“Mara” is introduced here as a guide/assistant persona.",why:"Confirm this is intentional branding and appears consistently elsewhere."},{x:63,y:52,type:"ux",label:"Chat-Style Interface",what:"Change this screen's interface to a chat style.",why:"Matches Mara's introduction as a conversational guide rather than a static form."},{x:63,y:70,type:"ux",label:"Duplicate Tile Icons",what:"The icons for the last 6 topic tiles are all identical.",why:"Makes them impossible to visually distinguish from one another."},{x:63,y:88,type:"dev",label:"Missing Selection Rule",what:"The screen doesn't tell users they need to select at least 3 topics before continuing - the Next button just silently won't enable.",why:"A first-time user has no way to self-diagnose why they're stuck."}]},
{id:"onboarding_12",page:14,title:"Onboarding 12",section:"Onboarding",img_src:"assets/screens/13-onboarding-12.jpg",annotations:[{x:63,y:28,type:"content",label:"Content Habits Copy",what:"When you find content you genuinely love, what do you do with it? - I save it / I send it to a friend / I just enjoy it / I post about it.",why:"Explores what users naturally do with content they value, helping identify their strongest content behaviours."},{x:63,y:68,type:"ux",label:"Clarify Single-Select",what:"This is select-one only - should be made explicit on screen.",why:"Without a hint, users may assume they can pick multiple options like the topics screen earlier in the flow."}]},
{id:"onboarding_13",page:15,title:"Onboarding 13",section:"Onboarding",img_src:"assets/screens/14-onboarding-13.jpg",annotations:[{x:63,y:28,type:"content",label:"Discovery Habits Copy",what:"How do you usually discover something worth your attention? - The algorithm finds it for me / A friend recommends it / I actively explore / Through community groups & chats.",why:"The wording is synced with actual responses and conversations to make the onboarding feel natural and warm."},{x:63,y:68,type:"ux",label:"Clarify Single-Select",what:"This is select-one only - should be made explicit on screen.",why:"Same as the previous screen - without a hint, users may assume multiple selection is allowed."}]},
{id:"onboarding_14",page:16,title:"Onboarding 14",section:"Onboarding",img_src:"assets/screens/15-onboarding-14.jpg",annotations:[{x:63,y:28,type:"content",label:"Connect Platforms Copy",what:"Where do you find your favourite content? Sub (optional): “Connect it so we can start there.”",why:"“Consume good content” is stiff, marketing-speak; this version is closer to how a person would actually ask the question."},{x:63,y:68,type:"dev",label:"Break in Journey Flow",what:"Move this screen to before Mara is introduced, if possible.",why:"Right now it interrupts the conversational thread Mara just started on the previous two screens."}]},
{id:"onboarding_14_1",page:17,title:"Onboarding 14.1",section:"Onboarding",img_src:"assets/screens/16-onboarding-14-1.jpg",annotations:[{x:63,y:18,type:"content",label:"Add X (Twitter) - Rewrite",what:"Add X (Twitter)",why:"Resolves naming inconsistency."},{x:63,y:45,type:"ux",label:"Twitter vs. X Labeling",what:"Change the Twitter logo to the X logo for consistency, and pick one label (“Twitter” or “X”) to use everywhere until the migration is complete - this screen currently says “Twitter” while a feed post elsewhere says “X (Formerly Twitter).”",why:"Two different names for the same platform reads as unfinished, not intentional."},{x:63,y:78,type:"dev",label:"Dev Question - Data Access",what:"What social media data do we get access to through these integrations?",why:"Needs an answer before this flow can be scoped for engineering."}]},
{id:"onboarding_15",page:18,title:"Onboarding 15",section:"Onboarding",img_src:"assets/screens/17-onboarding-15.jpg",annotations:[{x:63,y:24,type:"content",label:"“Kurators” → “People to Follow”",what:"“People we think you'll find interesting” - alt: “A few people worth following.”",why:"This is the single highest-leverage fix in the whole onboarding flow. The survey tested “dedicated curators” worst of three discovery framings (50/100, 30% actively uninterested). The identical behaviour worded as “people whose judgement you trust” scored 73.9/100 - the highest of any framing tested. “Kurators” is the one word this screen shouldn't use."},{x:63,y:72,type:"ux",label:"Dummy Data Cleanup",what:"Some suggested-account handles are placeholder/dummy text (e.g. “Rrtyu”, “abadsr”).",why:"Swap for real or realistic sample kurators before this ships."}]},
{id:"onboarding_16",page:19,title:"Onboarding 16",section:"Onboarding",img_src:"assets/screens/18-onboarding-16.jpg",annotations:[{x:63,y:28,type:"content",label:"Completion Copy",what:"Welcome aboard, Neha! May your next great discovery lead to someone else's.",why:"“Let your journey on Kurate begin” is generic app-launch language. Closing on the actual positioning promise reconnects the very last onboarding beat to why the product exists."},{x:63,y:68,type:"ux",label:"Change Iconography",what:"Change the iconography on this completion screen.",why:""}]},
{id:"home_1",page:20,title:"Home Page 1",section:"Home",img_src:"assets/screens/19-home-1.jpg",annotations:[{x:63,y:18,type:"content",label:"Rotating Prompt Copy",what:"Share: What's worth passing on today? / Found something worth a share? / What changed your thinking this week? / What's one interesting thing you found this week? / What have you been thinking about lately? / Share your latest great find! / Help someone discover something great. Invite: Bring in your friends / Bring in your favourite minds / Invite your friends.",why:"Frames sharing prompts around individual recipients rather than reach or audience-building, consistent with the finding that 94% of sharing goes to one person or a small known group, and the qual insight that sharing is intimate, not performative. Keeping the framing 1:1 and trust-based rather than public or performative."},{x:63,y:40,type:"ux",label:"Dummy Data Cleanup",what:"Sample post author/handles look like placeholder test data (e.g. “Hbzbz”, “Bsbd”, “Xcv”).",why:"Replace with realistic names before review/handoff."},{x:63,y:62,type:"ux",label:"Too Similar to Instagram",what:"Posts and the feed's look and feel are currently too similar to Instagram. A differentiator could be dedicated iconography for Like, Share, and Post.",why:""},{x:63,y:84,type:"dev",label:"Dev Question - Is This Dynamic?",what:"Is this rotating prompt actually dynamic, or static copy?",why:""}]},
{id:"home_2",page:21,title:"Home Page 2",section:"Home",img_src:"assets/screens/20-home-2.jpg",annotations:[{x:63,y:22,type:"content",label:"Composer Prompt Copy",what:"[Make dynamic] What's worth remembering? / What are you thinking about? / What's your insight here? / Put down your thoughts on this piece.",why:"Matching the qualitative insight that saving is emotionally about identity and self-authorship, this keeps the tone calm and low-pressure rather than task-like - avoiding language that could read as another to-do when guilt over unfinished intentions is already a named risk to relieve, not add to."},{x:63,y:55,type:"ux",label:"Dummy Data Cleanup",what:"Same placeholder handles as the previous screen (“Hbzbz”, “Bsbd”).",why:"Same cleanup needed here."},{x:63,y:82,type:"ux",label:"Change Page Layout",what:"Change the layout of this page.",why:"To check: can we add intent labels here?"}]},
{id:"home_3",page:22,title:"Home Page 3",section:"Home",img_src:"assets/screens/21-home-3.jpg",annotations:[{x:63,y:22,type:"content",label:"“Suggested accounts” Rename",what:"People worth following.",why:"“Suggested accounts” speaks like an algorithm. The underlying behaviour people actually want is people-led recommendation from similar-interest peers, which scores 65.0/100 - the single largest correlation with adoption intent anywhere in the dataset. Important to rephrase as “people worth following” instead of “suggested accounts.”"},{x:63,y:55,type:"ux",label:"Dummy Data Cleanup",what:"“Rrtyu” placeholder handle reappears here.",why:"Same dummy-data cleanup needed as Onboarding step 15."},{x:63,y:82,type:"ux",label:"Remove Banner Image",what:"Remove the banner image. The current design looks too similar to LinkedIn.",why:""}]},
{id:"home_4",page:23,title:"Home Page 4",section:"Home",img_src:"assets/screens/22-home-4.jpg",annotations:[{x:63,y:32,type:"ux",label:"Too Similar to Instagram",what:"The feed and post's look and feel are too similar to IG. Change the iconography and terminology for Like and Repost - interactions under Repost could also be shown visually on the post itself as a trust signal.",why:""},{x:63,y:68,type:"dev",label:"Bug - Share Redirects Incorrectly",what:"‘Share’ currently redirects to ‘Create a post’ instead of an actual share action.",why:""}]},
{id:"home_5",page:24,title:"Home Page 5",section:"Home",img_src:"assets/screens/23-home-5.jpg",annotations:[{x:63,y:22,type:"content",label:"“For You” Headline Copy",what:"Found by people, for you.",why:"Leads with people, not algorithm or platform, matching the finding that trust runs through people, not platforms or algorithms (“I'd rather trust my friend than an influencer I've never met”)."},{x:63,y:55,type:"ux",label:"Emphasize Personalization",what:"Add text under ‘For you’ to emphasise that the feed is personal/tailored.",why:""},{x:63,y:82,type:"ux",label:"“Create Post” Button Contrast",what:"Change the button colour and size for ‘Create Post’ - it's currently merging into the background.",why:""}]},
{id:"discover_1",page:25,title:"Discover 1",section:"Discover",img_src:"assets/screens/24-discover-1.jpg",annotations:[{x:63,y:18,type:"content",label:"Find People, Not Content",what:"Find people worth following.",why:"Triangulates with the idea that users come to Discover to find people, not content."},{x:63,y:50,type:"ux",label:"Surface Invite Here Too",what:"Add ‘Invite a friend’ as a button in the top right of this screen. Copy: “Build your corner of Kurate. Start with the people you'd most enjoy discovering alongside.”",why:""},{x:63,y:82,type:"dev",label:"Bug - Rooms/Interests Empty",what:"Nothing is showing up under any of the rooms/interests.",why:""}]},
{id:"discover_2_end_of_feed",page:26,title:"Discover 2 (End of Feed)",section:"Discover",img_src:"assets/screens/25-discover-2-end-of-feed.jpg",annotations:[{x:63,y:30,type:"content",label:"End-of-Feed Copy",what:"That's the end. On purpose. The good stuff doesn't need a thousand more posts stacked under it.",why:"Reinforces that the product isn't optimizing for endless engagement or volume, aligning with the finding that visible metrics and infinite-scroll dynamics are exactly what respondents named, unprompted, as a reason not to adopt."},{x:63,y:70,type:"ux",label:"Standard Thumbnail Fallback",what:"Add a standard Kurate thumbnail for posts where a thumbnail can't be extracted from the source.",why:""}]},
{id:"discover_3_collections",page:27,title:"Discover 3 (Collections)",section:"Discover",img_src:"assets/screens/26-discover-3-collections.jpg",annotations:[{x:63,y:50,type:"dev",label:"Bug - No Results Showing",what:"No results are showing.",why:""}]},
{id:"discover_4_search_bar",page:28,title:"Discover 4 (Search Bar)",section:"Discover",img_src:"assets/screens/27-discover-4-search-bar.jpg",annotations:[{x:63,y:50,type:"dev",label:"Bug - No Results Showing",what:"No results are showing.",why:""}]},
{id:"focus_mode_1",page:29,title:"Focus Mode 1",section:"Focus Mode",img_src:"assets/screens/28-focus-mode-1.jpg",annotations:[{x:63,y:28,type:"content",label:"Focus Mode Copy",what:"Nobody's fighting for your attention here. Take your time. Swipe up when you're ready for the next.",why:"A slight hint of outlaw energy helps distinguish the platform's tone."},{x:63,y:68,type:"ux",label:"Icons Aren't Intuitive",what:"The Scroll mode and Focus mode icons aren't intuitive.",why:""}]},
{id:"focus_mode_2",page:30,title:"Focus Mode 2",section:"Focus Mode",img_src:"assets/screens/29-focus-mode-2.jpg",annotations:[{x:63,y:40,type:"ux",label:"Asset Filed Under Wrong Feature?",what:"This file is named “Focus Mode” but the captured content looks like a suggested-accounts screen.",why:"Double check this asset is filed under the right feature before using it in dev handoff."},{x:63,y:75,type:"ux",label:"Drop Suggested Accounts from Focus Mode",what:"Drop suggested accounts from Focus Mode. This feature should be positioned as a clutter-free, immersive reading experience.",why:""}]},
{id:"post_like",page:31,title:"Post Interaction - Like",section:"Post Interaction",img_src:"assets/screens/30-post-like.jpg",annotations:[{x:63,y:50,type:"ux",label:"Check Repost Count Display",what:"Check whether a count shows up here for reposts.",why:""}]},
{id:"post_comment_1",page:32,title:"Post Interaction - Comment 1",section:"Post Interaction",img_src:"assets/screens/31-post-comment-1.jpg",annotations:[]},
{id:"post_comment_2",page:33,title:"Post Interaction - Comment 2",section:"Post Interaction",img_src:"assets/screens/32-post-comment-2.jpg",annotations:[]},
{id:"post_bookmark",page:34,title:"Post Interaction - Bookmark",section:"Post Interaction",img_src:"assets/screens/33-post-bookmark.jpg",annotations:[{x:63,y:28,type:"content",label:"Bookmark Modal Copy",what:"Save this post to a collection.",why:"62% want Kurate to build a personal collection, and the recommended copy direction explicitly favors “your library” and “your collection.”"},{x:63,y:66,type:"ux",label:"Shared “Couldn't Load” Empty State",what:"This modal shows “Collections could not be loaded.” - the same empty state also appears on Profile > Bookmarks > Collection.",why:"Confirm this is an intentional shared empty state, not an accidental capture of a broken load."}]},
{id:"post_share",page:35,title:"Post Interaction - Share",section:"Post Interaction",img_src:"assets/screens/34-post-share.jpg",annotations:[]},
{id:"post_repost",page:36,title:"Post Interaction - Repost",section:"Post Interaction",img_src:"assets/screens/35-post-repost.jpg",annotations:[{x:63,y:32,type:"content",label:"“Repost with your thoughts”",what:"Repost with your thoughts",why:"“Quote” implies the weight of crafting an audience-ready line, which users are averse to. “Repost with your thoughts” removes the pressure and extra cognition tied to making something audience-ready."},{x:63,y:70,type:"ux",label:"Surface View Interactions Higher",what:"“View interactions” shouldn't be buried three clicks deep if it's meant to work as a trust signal.",why:""}]},
{id:"post_repost_1",page:37,title:"Post Interaction - Repost 1",section:"Post Interaction",img_src:"assets/screens/36-post-repost-1.jpg",annotations:[]},
{id:"post_repost_2",page:38,title:"Post Interaction - Repost 2",section:"Post Interaction",img_src:"assets/screens/37-post-repost-2.jpg",annotations:[{x:63,y:45,type:"content",label:"Repost Quote Prompt Copy",what:"Alt: What's worth remembering? / What are you thinking? / What's your insight here? / Put down your thoughts here.",why:"Keeps prompts framed around personal reflection (“your insight,” “your thoughts”) rather than performance or sharing, matching the emotional core the qual data identifies."}]},
{id:"post_repost_3",page:39,title:"Post Interaction - Repost 3",section:"Post Interaction",img_src:"assets/screens/38-post-repost-3.jpg",annotations:[{x:63,y:50,type:"ux",label:"Repost Count as a Visual Element",what:"Show the repost count as a visual element directly on the post, next to the icon. Tapping it opens this interactions page.",why:""}]},
{id:"post_dropdown_list",page:40,title:"Post Interaction - Dropdown List",section:"Post Interaction",img_src:"assets/screens/39-post-dropdown-list.jpg",annotations:[]},

{id:"view_post_2",page:42,title:"View Post 2",section:"View Post",img_src:"assets/screens/41-view-post-2.jpg",annotations:[{x:63,y:28,type:"content",label:"Notes Prompt Copy",what:"Add a note. In the text box: “Anything worth remembering - future you will thank you.”",why:"Targets the strongest evidenced predictor in the study - forgetting why you saved something (r = +0.35, p = .007) - and “future you will thank you” matches the finding that saving is aspirational, not archival."},{x:63,y:68,type:"ux",label:"Placeholder Note Text",what:"The captured note text reads “ABC Test”.",why:"Placeholder QA text left in the mock; swap for a realistic example note."}]},
{id:"view_post_3",page:43,title:"View Post 3",section:"View Post",img_src:"assets/screens/42-view-post-3.jpg",annotations:[]},

{id:"profile_1",page:46,title:"Profile 1",section:"Profile",img_src:"assets/screens/45-profile-1.jpg",annotations:[{x:63,y:22,type:"content",label:"Share-Prompt Copy Alternatives",what:"Share your latest great find! / Pass along your best discovery / Help someone discover something great! / May your next discovery lead to somebody's best find today.",why:"94% of sharing goes to one person or a small group, and the qual insight that sharing here is one-on-one and intimate, not a broadcast."},{x:63,y:66,type:"ux",label:"Follower Count Visibility",what:"A visible follower count on your own profile is exactly the kind of reputational metric the survey recommends against (“no send counts, no view counts - inhibition is already the binding constraint, and visible metrics would raise it”).",why:"Worth raising with product, not just wordsmithing the label."}]},

{id:"profile_2_1_bookmarks_collection",page:48,title:"Profile 2.1 (Bookmarks - Collection)",section:"Profile",img_src:"assets/screens/47-profile-2-1-bookmarks-collection.jpg",annotations:[{x:63,y:55,type:"ux",label:"Shared “Couldn't Load” Empty State",what:"Same “couldn't load” empty/error state as the Bookmark modal in Post Interactions.",why:"Worth reviewing as one consistent empty state, and confirming it's intentional here."}]},

// ── State ──────────────────────────────────────────────────────────────────
let currentIdx = 0, activePin = null, sidebarOpen = false;

function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ── Sidebar toggle ─────────────────────────────────────────────────────────
document.getElementById('sidebarToggle').addEventListener('click',()=>{
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed',!sidebarOpen);
});

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  let last='',html='<div class="nav-highlight" id="navHighlight"></div>';
  screens.forEach((s,i)=>{
    if(s.section!==last){html+=`<div class="section-label">${esc(s.section)}</div>`;last=s.section;}
    const has=s.annotations.length>0;
    html+=`<button class="nav-item${has?' has-notes':''}${i===currentIdx?' active':''}" type="button" onclick="goTo(${i})" data-idx="${i}" title="${esc(s.title)}">
      <div class="nav-dot"></div><span class="nav-label">${esc(s.title)}</span>
      ${has?`<span class="badge">${s.annotations.length}</span>`:''}
    </button>`;
  });
  sb.innerHTML=html;
  positionNavHighlight();
}

function positionNavHighlight(){
  const hl=document.getElementById('navHighlight');
  const active=document.querySelector('.nav-item.active');
  if(!hl||!active){if(hl)hl.style.opacity='0';return;}
  hl.style.height=active.offsetHeight+'px';
  hl.style.transform='translateY('+active.offsetTop+'px)';
  hl.style.opacity='1';
}

// Sidebar markup (item list + badges) never changes at runtime — only which
// item is "active" does. Rebuilding innerHTML every navigation would destroy
// and recreate .nav-highlight each time, killing its slide transition. So we
// build the list once, then just toggle classes + reposition on navigation.
function updateSidebarActive(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',Number(el.dataset.idx)===currentIdx);
  });
  positionNavHighlight();
}

function renderScreen(){
  const viewer=document.getElementById('screenViewer');
  viewer.innerHTML=screens.map((s,si)=>{
    const eager=Math.abs(si-currentIdx)<=1;
    const src=s.img_src||'';
    const pins=s.annotations.map((a,ni)=>
      `<button class="pin ${a.type}" type="button" style="left:${a.x}%;top:${a.y}%"
        onclick="openFeedback(${si},${ni})" id="pin-${si}-${ni}" title="${esc(a.label)}">${ni+1}</button>`
    ).join('');
    const note=s.annotations.length
      ?`${s.annotations.length} feedback point${s.annotations.length>1?'s':''} - click a pin to view.`
      :'No feedback notes on this screen.';
    return `<section class="review-card${si===currentIdx?' active-screen':''}" id="screen-${si}" data-screen-index="${si}">
      <div class="phone-wrapper">
        <div class="phone-frame">
          ${src?`<img src="${src}" class="phone-img" alt="${esc(s.title)}" loading="${eager?'eager':'lazy'}" decoding="async"/>`:'<div style="width:280px;height:560px;background:#f0ecf5;display:flex;align-items:center;justify-content:center;color:#7c6a8a;font-size:.8rem">No image</div>'}
          ${pins}
        </div>
        <div class="card-popup" id="cpopup-${si}"></div>
        </div>
      <div class="feedback-panel">
        <div class="screen-meta">${esc(s.section)} · Screen ${si+1} of ${screens.length}</div>
        <div class="screen-title-area"><h2>${esc(s.title)}</h2></div>
        <div class="empty-state"><p>${esc(note)}</p></div>
      </div>
    </section>`;
  }).join('');
  requestAnimationFrame(()=>document.querySelectorAll('.pin').forEach(p=>p.classList.add('ready')));
}

function setCurrent(idx,scroll=false){
  currentIdx=Math.max(0,Math.min(idx,screens.length-1));
  updateSidebarActive();updateNav();
  document.querySelectorAll('.review-card').forEach((c,i)=>c.classList.toggle('active-screen',i===currentIdx));
  const fill=document.getElementById('progressFill');
  if(fill)fill.style.width=(((currentIdx+1)/screens.length)*100)+'%';
  if(scroll){const c=document.getElementById(`screen-${currentIdx}`);if(c)c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
}

// Positions the popup relative to its pin, clamped within the phone frame.
// Called on open AND after every reply-list redraw — the popup grows as
// replies come in, so a position computed once at open time would go stale
// and let the box spill past the bottom of the frame as a thread grows.
function positionPopup(si,ni){
  var cpopup=document.getElementById('cpopup-'+si);
  var note=screens[si]&&screens[si].annotations[ni];
  if(!cpopup||!note)return;
  var wrapper=document.querySelector('#screen-'+si+' .phone-wrapper');
  var wW=wrapper?wrapper.offsetWidth:270;
  var wH=wrapper?wrapper.offsetHeight:500;
  var pinX=(note.x/100)*wW;
  var pinY=(note.y/100)*wH;
  var popH=cpopup.offsetHeight;
  var left=pinX+18;
  var top=pinY-popH/2;
  if(top<0)top=4;
  if(top+popH>wH)top=Math.max(4,wH-popH-4);
  cpopup.style.left=left+'px';
  cpopup.style.top=top+'px';
}

function openFeedback(si,ni){
  var note=screens[si].annotations[ni];if(!note)return;
  // A pin on a peeking side card is still clickable without centering that
  // card first - scroll it into place when that happens, instead of just
  // marking it "active" (full brightness) while it stays off to the side.
  setCurrent(si,si!==currentIdx);

  // Close any already-open popups
  closeInline();

  // Highlight pin
  document.querySelectorAll('.pin.active').forEach(function(p){p.classList.remove('active');});
  activePin=ni;
  var pinEl=document.getElementById('pin-'+si+'-'+ni);
  if(pinEl)pinEl.classList.add('active');

  var cpopup=document.getElementById('cpopup-'+si);
  if(!cpopup)return;

  // Elevate this card above every sibling for as long as its popup is open -
  // see the has-open-popup rule for why this is load-bearing, not cosmetic.
  var ownerCard=document.getElementById('screen-'+si);
  if(ownerCard)ownerCard.classList.add('has-open-popup');

  // Build content
  cpopup.innerHTML='<article class="comment-card">'
    +'<div class="comment-top"><div>'
    +'<div class="comment-type '+note.type+'">'+(note.type==='content'?'Copy Edit':note.type==='dev'?'Dev / Bug':'UI / UX')+'</div>'
    +'<div class="comment-title">'+esc(note.label)+'</div>'
    +'</div><button class="comment-close" type="button" onclick="closeInline()">&#x2715;</button></div>'
    +'<div class="comment-label">What</div><div class="comment-copy">'+esc(note.what)+'</div>'
    +'<div class="comment-label">Why</div><div class="comment-copy">'+esc(note.why)+'</div>'
    +'<div class="reply-section">'+repliesHtml(si,ni)+'</div>'
    +'</article>';

  // Show hidden to measure height, then position (see positionPopup)
  cpopup.style.display='block';
  cpopup.style.visibility='hidden';
  cpopup.style.left='-9999px';
  positionPopup(si,ni);
  cpopup.style.visibility='visible';
  requestAnimationFrame(function(){cpopup.classList.add('open');});

  // Live-sync replies for this pin (Firestore listener; no-op if unconfigured)
  watchReplies(si,ni);
}

function closeInline(){
  activePin=null;
  stopWatchingReplies();
  document.querySelectorAll('.pin.active').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.card-popup.open').forEach(function(p){
    p.classList.remove('open');
    setTimeout(function(){
      if(!p.classList.contains('open')){
        p.style.display='none';p.innerHTML='';
        // Card only loses its elevated stacking once its popup is actually
        // gone - drop it earlier and the fade-out itself gets covered by
        // a neighboring card mid-close.
        var ownerCard=p.closest('.review-card');
        if(ownerCard)ownerCard.classList.remove('has-open-popup');
      }
    },280);
  });
}

function goTo(idx){
  activePin=null;closeInline();
  setCurrent(idx,true);
  const items=document.querySelectorAll('.nav-item');
  if(items[idx])items[idx].scrollIntoView({behavior:'smooth',block:'nearest'});
}

function navigate(dir){const n=currentIdx+dir;if(n>=0&&n<screens.length)goTo(n);}

function updateNav(){}

// ── Phone-frame tilt-on-hover ──────────────────────────────────────────────
function setupTilt(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const viewer=document.getElementById('screenViewer');
  const MAX=2.5; // max tilt in degrees — kept subtle on purpose
  function reset(frame){
    frame.style.transition='';
    frame.style.transform='';
  }
  // Coalesced to one update per animation frame instead of running on every
  // raw mousemove — reading getBoundingClientRect() on every single event
  // (which can fire well over 60x/sec) forces a synchronous layout flush
  // each time, which is a common source of jank when other things on the
  // page are also animating.
  let raf=null, pendingEvent=null;
  function applyTilt(){
    raf=null;
    const e=pendingEvent;
    const frame=e.target.closest('.phone-frame');
    if(!frame)return;
    const r=frame.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width;
    const py=(e.clientY-r.top)/r.height;
    const rx=((0.5-py)*MAX*2).toFixed(2);
    const ry=((px-0.5)*MAX*2).toFixed(2);
    frame.style.transition='transform .12s var(--ease)';
    frame.style.transform='perspective(1400px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
  }
  viewer.addEventListener('mousemove',function(e){
    pendingEvent=e;
    if(raf===null)raf=requestAnimationFrame(applyTilt);
  },{passive:true});
  viewer.addEventListener('mouseout',function(e){
    const from=e.target.closest&&e.target.closest('.phone-frame');
    const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.phone-frame');
    if(from&&from!==to)reset(from);
  });
}

function setupScroll(){
  const viewer=document.getElementById('screenViewer');
  let tick=false;
  viewer.addEventListener('scroll',()=>{
    if(tick)return;tick=true;
    requestAnimationFrame(()=>{
      // While a popup is open (including mid-flight while its own card is
      // being smooth-scrolled into center), don't let this passive
      // recentering logic fight it — an intermediate card can briefly look
      // "more centered" than the target while the scroll is still animating,
      // which would close the popup we just opened a moment after opening it.
      if(activePin===null){
        const cx=viewer.getBoundingClientRect().left+viewer.clientWidth/2;
        let best=currentIdx,bestD=Infinity;
        document.querySelectorAll('.review-card').forEach(card=>{
          const r=card.getBoundingClientRect();
          const d=Math.abs((r.left+r.width/2)-cx);
          if(d<bestD){bestD=d;best=Number(card.dataset.screenIndex);}
        });
        if(best!==currentIdx){closeInline();setCurrent(best,false);}
      }
      tick=false;
    });
  },{passive:true});
}

// ── Init ───────────────────────────────────────────────────────────────────
renderSidebar();renderScreen();setCurrent(0,false);setupScroll();setupTilt();

// Focus on load + Enter key
document.addEventListener('DOMContentLoaded',function(){
  var el=document.getElementById('pwInput');
  if(el){
    setTimeout(function(){el.focus();},100);
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter') unlock();

function unlock(){
  var input=document.getElementById('pwInput');
  var err=document.getElementById('gateErr');
  var gate=document.getElementById('gate');
  if(!input||!gate)return;

  var val=input.value;
  if(val==='Kurate2026'){
    // Hide error, start fade
    err.style.opacity='0';
    gate.style.transition='opacity 0.65s cubic-bezier(.4,0,.2,1)';
    gate.style.opacity='0';
    gate.style.pointerEvents='none';
    // Remove gate. Replies sync live via Firestore listeners (attached
    // per-popup in openFeedback) — no prefetch or polling needed.
    setTimeout(function(){
      gate.style.display='none';
    },700);
  } else {
    // Wrong password — shake + red border
    input.classList.remove('shake','error');
    void input.offsetWidth; // force reflow to restart animation
    input.classList.add('shake','error');
    err.style.opacity='1';
    input.value='';
    input.focus();
    setTimeout(function(){
      input.classList.remove('error');
    },1400);
  }
}

// ── Replies (Firestore — see FIREBASE.md) ───────────────────────
// One-time setup, reusable forever: create ONE Firebase project, paste its
// config below, and you never touch the Firebase console again. Every future
// clone of this template just needs a different REPLIES_SITE string — same
// config, same collection, same security rule, no new project/deployment.
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCKy7p-m1YHqlHISzP0N1j7TJ9uZMq4Zwk",
  authDomain: "kurate-reviews.firebaseapp.com",
  projectId: "kurate-reviews",
  storageBucket: "kurate-reviews.firebasestorage.app",
  messagingSenderId: "503399347627",
  appId: "1:503399347627:web:5ca7f67245e69340b64eee"
};
var REPLIES_SITE = 'kurate-recommendations'; // unique per clone-repo
var REPLIES_COLLECTION = 'kurate_reviews';   // shared across all clone-repos

var LS_KEY = 'kurate_recommendations_replies_v1';
var db = null, repliesEnabled = false, _unsubReplies = null;

// ── Lazy-load the Firebase SDK ───────────────────────────────────────────
// Nothing is fetched from gstatic.com until a reply popup is actually opened
// AND FIREBASE_CONFIG is filled in — keeps first paint fast, and costs
// nothing at all while Firebase isn't set up yet.
var _fbLoadStarted = false, _fbReadyCbs = [];
function ensureFirebaseLoaded(cb){
  if(repliesEnabled||!FIREBASE_CONFIG.apiKey){cb&&cb();return;}
  if(_fbLoadStarted){if(cb)_fbReadyCbs.push(cb);return;}
  _fbLoadStarted=true;
  if(cb)_fbReadyCbs.push(cb);
  function flush(){_fbReadyCbs.forEach(function(fn){fn();});_fbReadyCbs=[];}
  var s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js';
  s1.onload=function(){
    var s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js';
    s2.onload=function(){
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        db=firebase.firestore();
        repliesEnabled=true;
      }catch(e){console.warn('Firebase init failed — falling back to localStorage:',e);}
      flush();
    };
    s2.onerror=flush;
    document.head.appendChild(s2);
  };
  s1.onerror=flush;
  document.head.appendChild(s1);
}

// ── localStorage fallback / local cache (used when Firebase isn't configured,
// and as an instant-paint cache while the live listener catches up) ────────
function lsAll(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(e){return {};}}
function lsSave(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){}}
function lsGet(k){return(lsAll()[k]||[]);}
function lsSet(k,arr){var d=lsAll();d[k]=arr;lsSave(d);}
function rKey(si,ni){return screens[si].id+'-'+ni;}
function skeyOf(key){return REPLIES_SITE+'::'+key;}

// ── Live listener — attached when a popup opens, detached when it closes ──
// _watchToken guards against a stale load finishing after the popup has
// already closed (or a different popup has opened) — ensureFirebaseLoaded's
// callback can fire either synchronously (SDK already loaded) or much later
// (first-ever load), so we can't rely on DOM/CSS state at call time to know
// whether this request is still the one that matters.
var _watchToken = 0;
function watchReplies(si,ni){
  var key=rKey(si,ni);
  if(_unsubReplies){_unsubReplies();_unsubReplies=null;}
  redrawReplies(si,ni); // instant paint from local cache while Firebase (if any) loads
  var myToken=++_watchToken;
  ensureFirebaseLoaded(function(){
    if(!repliesEnabled)return;
    if(myToken!==_watchToken)return; // superseded by a newer open/close since this started
    // No .orderBy() here on purpose — combining it with .where() on a
    // different field requires a manual composite index in Firestore, which
    // would otherwise silently fail (comments save fine, but the listener
    // errors out and nothing ever renders). Sorting client-side instead
    // needs zero index setup, ever.
    _unsubReplies=db.collection(REPLIES_COLLECTION)
    .where('skey','==',skeyOf(key))
    .onSnapshot(function(snap){
      var replies=snap.docs.map(function(d){
        var v=d.data();
        return {id:d.id,name:v.name,text:v.text,ts:v.ts,edited:!!v.edited};
      });
      replies.sort(function(a,b){return a.ts-b.ts;});
      lsSet(key,replies);
      redrawReplies(si,ni);
    },function(err){console.warn('Firestore listen error:',err);});
  });
}

function stopWatchingReplies(){
  _watchToken++; // invalidate any in-flight watchReplies() load callback
  if(_unsubReplies){_unsubReplies();_unsubReplies=null;}
}

// ── CRUD ───────────────────────────────────────────────────────
function addReply(si,ni){
  var nameEl=document.getElementById('rname-'+si+'-'+ni);
  var msgEl=document.getElementById('rmsg-'+si+'-'+ni);
  if(!nameEl||!msgEl)return;
  var name=(nameEl.value||'').trim()||'Anonymous';
  var text=(msgEl.value||'').trim();
  if(!text)return;
  var key=rKey(si,ni);
  msgEl.value='';
  try{localStorage.setItem('kurate_last_name',name);}catch(e){}

  if(repliesEnabled){
    db.collection(REPLIES_COLLECTION).add({
      skey:skeyOf(key),site:REPLIES_SITE,key:key,
      name:name,text:text,ts:Date.now(),edited:false
    }).catch(function(e){console.warn('Add reply failed:',e);});
    // The onSnapshot listener above repaints instantly (Firestore echoes
    // local writes before the server round-trip completes) — no manual
    // optimistic-update bookkeeping needed.
  } else {
    var replies=lsGet(key);
    replies.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name,text:text,ts:Date.now()});
    lsSet(key,replies);
    redrawReplies(si,ni);
  }
}

function deleteReply(si,ni,id){
  var key=rKey(si,ni);
  if(repliesEnabled){
    db.collection(REPLIES_COLLECTION).doc(id).delete().catch(function(e){console.warn('Delete failed:',e);});
  } else {
    lsSet(key,lsGet(key).filter(function(r){return r.id!==id;}));
    redrawReplies(si,ni);
  }
}

function startEdit(si,ni,id){
  var textEl=document.getElementById('rt-'+id);
  if(!textEl)return;
  var cur=textEl.textContent||'';
  // Original text is stashed in data-orig (a plain HTML attribute) rather than
  // passed through an onclick="..." JS-string argument — a reply containing an
  // apostrophe would otherwise break out of that string and throw on Cancel.
  textEl.innerHTML='<textarea class="reply-text-edit" id="re-'+id+'" rows="2" data-orig="'+esc(cur)+'">'+esc(cur)+'</textarea>'
    +'<button class="reply-save-btn" onclick="saveEdit('+si+','+ni+',\''+id+'\')">Save</button>'
    +' <button class="reply-act" onclick="cancelEdit(\''+id+'\')">Cancel</button>';
  var ta=document.getElementById('re-'+id);
  if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
}

function cancelEdit(id){
  var ta=document.getElementById('re-'+id);
  var textEl=document.getElementById('rt-'+id);
  if(ta&&textEl)textEl.innerHTML=esc(ta.dataset.orig||'');
}

function saveEdit(si,ni,id){
  var ta=document.getElementById('re-'+id);
  if(!ta)return;
  var text=ta.value.trim();
  if(!text)return;
  var key=rKey(si,ni);
  if(repliesEnabled){
    db.collection(REPLIES_COLLECTION).doc(id).update({text:text,edited:true}).catch(function(e){console.warn('Edit failed:',e);});
  } else {
    lsSet(key,lsGet(key).map(function(r){return r.id===id?Object.assign({},r,{text:text,edited:true}):r;}));
    redrawReplies(si,ni);
  }
}

// ── Render ──────────────────────────────────────────────────────
function timeAgo(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function repliesHtml(si,ni){
  var key=rKey(si,ni);
  var replies=lsGet(key);
  var savedName='';
  try{savedName=localStorage.getItem('kurate_last_name')||'';}catch(e){}

  var pencil='<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5l2 2L4 10H2v-2z"/><line x1="6.5" y1="3.5" x2="8.5" y2="5.5"/></svg>';
  var trash='<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="3" x2="10" y2="3"/><path d="M4 3V2h4v1"/><path d="M3 3l.7 7h4.6l.7-7"/></svg>';

  var listHtml=replies.length
    ? replies.map(function(r){
        return '<div class="reply-item">'
          +'<div class="reply-row">'
          +'<div class="reply-meta"><strong>'+esc(r.name)+'</strong> &middot; '+timeAgo(r.ts)+(r.edited?' &middot; edited':'')+'</div>'
          +'<div class="reply-icon-btns">'
          +'<button class="reply-icon-btn" onclick="startEdit('+si+','+ni+',\''+r.id+'\')" title="Edit">'+pencil+'</button>'
          +'<button class="reply-icon-btn del" onclick="deleteReply('+si+','+ni+',\''+r.id+'\')" title="Delete">'+trash+'</button>'
          +'</div></div>'
          +'<div id="rt-'+r.id+'" class="reply-text">'+esc(r.text)+'</div>'
          +'</div>';
      }).join('')
    : '';

  return '<hr class="reply-divider"/>'
    +(listHtml?'<div class="reply-list" id="rlist-'+si+'-'+ni+'">'+listHtml+'</div>':'')
    +'<div class="reply-add">'
    +'<input class="reply-name-input" id="rname-'+si+'-'+ni+'" placeholder="Name" value="'+esc(savedName)+'" maxlength="32"/>'
    +'<textarea class="reply-msg-input" id="rmsg-'+si+'-'+ni+'" placeholder="Reply…" rows="1" maxlength="400" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();addReply('+si+','+ni+')}"></textarea>'
    +'<button class="reply-submit" onclick="addReply('+si+','+ni+')" title="Send">&#x2192;</button>'
    +'</div>';
}

function redrawReplies(si,ni){
  var card=document.getElementById('cpopup-'+si);
  if(!card)return;
  var sec=card.querySelector('.reply-section');
  if(sec)sec.innerHTML=repliesHtml(si,ni);
  positionPopup(si,ni); // re-clamp — the thread just changed height
}
// ── End replies ─────────────────────────────────────────────────

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&activePin!==null){closeInline();return;}
  if(e.key==='ArrowRight'||e.key==='ArrowDown')navigate(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')navigate(-1);
});
</script>
